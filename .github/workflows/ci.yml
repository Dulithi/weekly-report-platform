name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - "**/*.png"
      - "**/*.pptx"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - "**/*.png"
      - "**/*.pptx"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up Java 25
        uses: actions/setup-java@v5.6.0
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Run backend test suite
        run: ./mvnw --batch-mode --no-transfer-progress verify

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up Node.js 24
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 24.20.0
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Check TypeScript
        run: npx tsc --noEmit

      - name: Build production frontend
        env:
          NEXT_PUBLIC_API_URL: https://api.example.invalid/api/v1
        run: npm run build -- --webpack

  container-builds:
    name: Build ${{ matrix.application }} container
    needs: [backend, frontend]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        application: [backend, frontend]
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Build backend image
        if: matrix.application == 'backend'
        run: docker build --tag weekly-report-backend:ci backend

      - name: Build frontend image
        if: matrix.application == 'frontend'
        run: >-
          docker build
          --build-arg NEXT_PUBLIC_API_URL=https://api.example.invalid/api/v1
          --tag weekly-report-frontend:ci
          frontend
