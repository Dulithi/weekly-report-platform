spring:
  application:
    name: weekly-report-api

  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    web:
      pageable:
        max-page-size: 100

  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    protocol: smtp
    test-connection: false
    properties:
      "[mail.smtp.auth]": ${SMTP_AUTH:false}
      "[mail.smtp.starttls.enable]": ${SMTP_STARTTLS:false}
      "[mail.smtp.starttls.required]": ${SMTP_STARTTLS_REQUIRED:false}
      "[mail.smtp.connectiontimeout]": ${SMTP_CONNECTION_TIMEOUT_MS:5000}
      "[mail.smtp.timeout]": ${SMTP_READ_TIMEOUT_MS:5000}
      "[mail.smtp.writetimeout]": ${SMTP_WRITE_TIMEOUT_MS:5000}

server:
  port: ${SERVER_PORT:8080}

logging:
  level:
    root: INFO
    com.weeklyreport: INFO
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} level=%-5level requestId=%X{requestId:-none} logger=%logger{36} message=%msg%n"

management:
  endpoints:
    web:
      exposure:
        include: health,info

  endpoint:
    health:
      show-details: never

# API documentation is opt-in so a production deployment does not publish its
# complete endpoint catalogue by accident. The dev profile enables it below.
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

app:
  bootstrap-admin:
    enabled: ${BOOTSTRAP_ADMIN_ENABLED:false}
    email: ${BOOTSTRAP_ADMIN_EMAIL:}
    password: ${BOOTSTRAP_ADMIN_PASSWORD:}
    first-name: ${BOOTSTRAP_ADMIN_FIRST_NAME:}
    last-name: ${BOOTSTRAP_ADMIN_LAST_NAME:}

  invitation-mail:
    enabled: ${INVITATION_EMAIL_ENABLED:false}
    from: ${INVITATION_EMAIL_FROM:}
    acceptance-base-url: ${INVITATION_ACCEPTANCE_BASE_URL:${FRONTEND_URL}}
    application-name: ${INVITATION_EMAIL_APP_NAME:Weekly Report Platform}

  assistant:
    enabled: ${AI_ASSISTANT_ENABLED:false}
    api-key: ${OPENAI_API_KEY:}
    base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
    model: ${OPENAI_MODEL:gpt-5.6-luna}
    reasoning-effort: ${OPENAI_REASONING_EFFORT:low}
    connect-timeout: ${OPENAI_CONNECT_TIMEOUT:2s}
    request-timeout: ${OPENAI_REQUEST_TIMEOUT:20s}
    max-question-characters: ${AI_MAX_QUESTION_CHARACTERS:500}
    max-history-messages: ${AI_MAX_HISTORY_MESSAGES:6}
    max-history-characters: ${AI_MAX_HISTORY_CHARACTERS:2000}
    max-weeks: ${AI_MAX_WEEKS:12}
    max-reports: ${AI_MAX_REPORTS:40}
    max-context-characters: ${AI_MAX_CONTEXT_CHARACTERS:60000}
    max-output-tokens: ${AI_MAX_OUTPUT_TOKENS:600}
    rate-limit:
      max-requests: ${AI_MAX_REQUESTS_PER_WINDOW:10}
      window: ${AI_REQUEST_WINDOW:1m}

  demo-seed:
    enabled: ${DEMO_SEED_ENABLED:false}
    password: ${DEMO_PASSWORD:}

  reporting:
    time-zone: ${REPORTING_TIME_ZONE:Asia/Colombo}

  security:
    login-rate-limit:
      max-attempts: ${LOGIN_MAX_ATTEMPTS:10}
      window: ${LOGIN_ATTEMPT_WINDOW:15m}

    invitation:
      ttl: ${INVITATION_TTL:24h}

    jwt:
      issuer: weekly-report-api
      access-token-ttl: 15m

    refresh-token:
      ttl: 7d
      # An application-specific name avoids collisions with unrelated apps on
      # localhost and with sibling services deployed on the same host.
      cookie-name: ${REFRESH_COOKIE_NAME:weekly_report_refresh}
      secure: ${REFRESH_COOKIE_SECURE}
      same-site: ${REFRESH_COOKIE_SAME_SITE}

    cors:
      allowed-origin: ${FRONTEND_URL}
