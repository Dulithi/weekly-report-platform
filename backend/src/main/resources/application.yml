spring:
  application:
    name: weekly-report-api

  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    web:
      pageable:
        max-page-size: 100

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info

  endpoint:
    health:
      show-details: never

# API documentation is opt-in so a production deployment does not publish its
# complete endpoint catalogue by accident. The dev profile enables it below.
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

app:
  demo-seed:
    enabled: ${DEMO_SEED_ENABLED:false}
    password: ${DEMO_PASSWORD:}

  reporting:
    time-zone: ${REPORTING_TIME_ZONE:Asia/Colombo}

  security:
    login-rate-limit:
      max-attempts: ${LOGIN_MAX_ATTEMPTS:10}
      window: ${LOGIN_ATTEMPT_WINDOW:15m}

    invitation:
      ttl: ${INVITATION_TTL:24h}

    jwt:
      issuer: weekly-report-api
      access-token-ttl: 15m

    refresh-token:
      ttl: 7d
      # An application-specific name avoids collisions with unrelated apps on
      # localhost and with sibling services deployed on the same host.
      cookie-name: ${REFRESH_COOKIE_NAME:weekly_report_refresh}
      secure: ${REFRESH_COOKIE_SECURE}
      same-site: ${REFRESH_COOKIE_SAME_SITE}

    cors:
      allowed-origin: ${FRONTEND_URL}
