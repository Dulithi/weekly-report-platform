spring:
  application:
    name: weekly-report-api

  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info

  endpoint:
    health:
      show-details: never

app:
  security:
    jwt:
      issuer: weekly-report-api
      access-token-ttl: 15m

    refresh-token:
      ttl: 7d
      cookie-name: refresh_token
      secure: ${REFRESH_COOKIE_SECURE}
      same-site: ${REFRESH_COOKIE_SAME_SITE}

    cors:
      allowed-origin: ${FRONTEND_URL}